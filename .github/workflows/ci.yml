# DiskMap 2.x 的检查、原生打包、包内程序自检和标签发布。
# 所有暂存、Tauri CLI 和最终产物均位于 target/，具体脚本可在本地单独运行。
name: ci

on:
  push:
    branches: [main]
    tags: ["v2.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: 核对版本
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tauri_cli: ${{ steps.metadata.outputs.tauri_cli }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: metadata
        run: python -B crates/diskmap-desktop/packaging/package.py metadata

  check:
    name: 检查 ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, shell: bash }
          - { os: windows-latest, shell: pwsh }
          - { os: macos-latest, shell: bash }
    steps:
      - uses: actions/checkout@v7
      # 上游按工具链分支引用，这里固定 master 提交并单独指定 stable。
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 隔离缓存和设置
        run: python -B crates/diskmap-desktop/packaging/package.py isolate
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Python 契约测试依赖
        run: python -m pip install "psutil>=6.1,<8"
      - name: 格式检查
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy（含桌面版和测试目标）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust 测试
        id: rust_tests
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: cargo test --workspace --no-fail-fast --locked
      - name: 构建契约测试的真实 CLI
        run: cargo build -p diskmap-cli --locked
      - name: Rust 契约测试
        id: rust_contract
        continue-on-error: ${{ runner.os == 'macOS' }}
        env:
          DISKMAP_CONTRACT_IMPL: rust
        run: python -B -m unittest discover -s tests/contract -v
      - name: 旧版契约测试
        id: legacy_contract
        if: runner.os == 'Linux' || runner.os == 'Windows'
        env:
          DISKMAP_CONTRACT_IMPL: legacy
        run: python -B -m unittest discover -s tests/contract -v
      - name: 记录 macOS 测试结果
        if: always() && runner.os == 'macOS'
        shell: bash
        env:
          RUST_TESTS: ${{ steps.rust_tests.outcome }}
          RUST_CONTRACT: ${{ steps.rust_contract.outcome }}
        run: |
          {
            echo '### macOS 测试结果'
            echo ''
            echo "Rust tests — $RUST_TESTS"
            echo "Rust contract — $RUST_CONTRACT"
            echo ''
            echo '失败详情保留在对应步骤日志中，交由后续 macOS 验收处理。'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: 打包 ${{ matrix.platform }}
    needs: [version, check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: pwsh
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-latest
            shell: bash
            platform: macos-arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            shell: bash
            platform: macos-x64
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            shell: bash
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    env:
      DISKMAP_VERSION: ${{ needs.version.outputs.version }}
      TAURI_CLI_VERSION: ${{ needs.version.outputs.tauri_cli }}
      # linuxdeploy 等 AppImage 工具在无 FUSE 的 runner 上也能工作。
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.platform }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 隔离缓存和设置
        run: python -B crates/diskmap-desktop/packaging/package.py isolate
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf file
      - name: 安装固定版本 Tauri CLI（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked \
            --root "$GITHUB_WORKSPACE/target/tools" --target-dir "$GITHUB_WORKSPACE/target/tauri-cli-build"
      - name: 安装固定版本 Tauri CLI（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install tauri-cli --version $env:TAURI_CLI_VERSION --locked `
            --root "$env:GITHUB_WORKSPACE/target/tools" --target-dir "$env:GITHUB_WORKSPACE/target/tauri-cli-build"
      - name: 编译单独的 CLI
        run: cargo build --release -p diskmap-cli --locked
      - name: CLI 的 macOS ad-hoc 签名
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --force --sign - target/release/diskmap-cli
      - name: 暂存 sidecar 与打包专用配置
        run: python -B crates/diskmap-desktop/packaging/package.py prepare --target ${{ matrix.target }}
      - name: Tauri 打包（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        working-directory: crates/diskmap-desktop
        run: |
          ../../target/tools/bin/cargo-tauri build --ci \
            --config packaging/tauri.bundle.json --config ../../target/packaging/tauri.platform.json \
            --bundles '${{ matrix.bundles }}' -- --locked
      - name: Tauri 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: crates/diskmap-desktop
        run: |
          & ../../target/tools/bin/cargo-tauri.exe build --ci `
            --config packaging/tauri.bundle.json --config ../../target/packaging/tauri.platform.json `
            --bundles '${{ matrix.bundles }}' -- --locked
      - name: 整理安装包与压缩包
        run: python -B crates/diskmap-desktop/packaging/package.py collect --platform ${{ matrix.platform }} --bundles ${{ matrix.bundles }}
      - name: Windows 安装、包内自检与卸载
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 20
        run: ./crates/diskmap-desktop/packaging/smoke-windows.ps1 -Version $env:DISKMAP_VERSION
      - name: macOS 挂载 dmg 与包内自检
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 20
        run: bash crates/diskmap-desktop/packaging/smoke-macos.sh "$DISKMAP_VERSION" '${{ matrix.platform }}'
      - name: Linux 安装 deb、AppImage 与压缩包自检
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 20
        run: bash crates/diskmap-desktop/packaging/smoke-linux.sh "$DISKMAP_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: DiskMap-package-${{ matrix.platform }}
          path: target/packaging/out/*
          if-no-files-found: error
          overwrite: true

  skill:
    name: 技能包
    needs: [version, check]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 生成技能包
        run: python -B scripts/make_skill_zip.py -o target/packaging/out/diskmap-skill.zip
      - uses: actions/upload-artifact@v7
        with:
          name: DiskMap-package-skill
          path: target/packaging/out/diskmap-skill.zip
          if-no-files-found: error
          overwrite: true

  assemble:
    name: 汇总产物与 SHA256
    needs: [version, package, skill]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: DiskMap-package-*
          path: target/packaging/out
          merge-multiple: true
      - name: 核对全部 13 个产物并生成校验和
        run: |
          python -B crates/diskmap-desktop/packaging/package.py checksums
          cd target/packaging/out
          sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: DiskMap-release
          path: target/packaging/out/*
          if-no-files-found: error
          overwrite: true

  release:
    name: 发布 v2 标签
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: [version, assemble]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: DiskMap-release
          path: target/packaging/out
      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISKMAP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd target/packaging/out
          sha256sum --check SHA256SUMS.txt
          release_args=()
          if [[ "$DISKMAP_VERSION" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "DiskMap $GITHUB_REF_NAME" --generate-notes "${release_args[@]}"
