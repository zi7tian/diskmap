# 在 Windows / macOS / Linux 上分别打包 DiskMap，并用 --selftest 检验打包结果。
# - 手动运行（Actions 页面 → build → Run workflow）或推送到 main：产物在运行记录的 Artifacts 里下载
# - 推送 v 开头的标签（如 git tag v1.1.0 && git push --tags）：额外自动发布到 Releases
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }     # Apple 芯片
          - { os: macos-15-intel, target: macos-x64 }     # Intel 芯片
          - { os: ubuntu-22.04, target: linux-x64 }       # 较老的 glibc，兼容更多发行版
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -r requirements-build.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 打包
        run: python -m PyInstaller --noconfirm --clean packaging/diskmap.spec

      - name: 自检（Windows）
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: pwsh
        run: |
          # 无控制台的程序不会被 shell 等待，用 WaitForExit 等它结束（最多 4 分钟）并拿到退出码
          $p = Start-Process -FilePath dist\DiskMap.exe -ArgumentList '--selftest','--report','selftest.json' -PassThru
          $null = $p.Handle   # 先取句柄，否则进程结束后 ExitCode 可能读不到
          if (-not $p.WaitForExit(240000)) {
            Write-Host "自检超时，结束进程"
            Get-Process DiskMap -ErrorAction SilentlyContinue | Stop-Process -Force
            if (Test-Path selftest.json) { Get-Content selftest.json }
            exit 1
          }
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 自检（macOS / Linux）
        if: runner.os != 'Windows'
        timeout-minutes: 6
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then BIN=dist/DiskMap.app/Contents/MacOS/DiskMap; else BIN=dist/DiskMap; fi
          code=0
          "$BIN" --selftest --report selftest.json > /dev/null || code=$?
          cat selftest.json || true
          exit $code

      - name: 整理产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\DiskMap.exe out\DiskMap-${{ matrix.target }}.exe

      - name: 整理产物（macOS）
        if: runner.os == 'macOS'
        run: |
          mkdir -p out stage
          cp -R dist/DiskMap.app stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "DiskMap" -srcfolder stage -ov -format UDZO out/DiskMap-${{ matrix.target }}.dmg

      - name: 整理产物（Linux）
        if: runner.os == 'Linux'
        run: |
          mkdir -p out stage/DiskMap
          cp dist/DiskMap install-desktop.sh README.md stage/DiskMap/
          cp packaging/icons/diskmap-512.png stage/DiskMap/diskmap.png
          tar -C stage -czf out/DiskMap-${{ matrix.target }}.tar.gz DiskMap

      - uses: actions/upload-artifact@v4
        with:
          name: DiskMap-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DiskMap $GITHUB_REF_NAME" \
            --generate-notes
