[package]
name = "diskmap-core"
description = "DiskMap 核心库：扫描、完整索引、重要程度分类、分析、本地 HTTP 接口（不含窗口）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# 本地 HTTP 接口（server 模块，T05）。命令行和桌面版会启用；只用扫描功能时不需要。
server = ["dep:httparse"]

# 需要新依赖时用 `cargo add -p diskmap-core <名称>`，不要整体改写本文件（两个助手可能同时在改）。
[dependencies]
crc32fast = "1.5.5"
getrandom = "0.3"
httparse = { version = "1.10.1", optional = true }
lz4_flex = "0.14.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Windows：系统调用（目录读取、磁盘空间、管理员、界面语言）和注册表（已安装的程序）
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell"] }
winreg = "0.56.0"

# Unix：用户数据库、磁盘空间、是否 root
[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
